# Inter-cell Gateway 

node:
  id: intercell-gw
  cluster: intercell-gw

# Tracing
tracing:
  http:
    name: envoy.tracers.opentelemetry
    typed_config:
      "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
      grpc_service:
        envoy_grpc:
          cluster_name: otel_collector
        timeout: 5s
      service_name: "intercell-gateway"
      resource_detectors:
        - name: envoy.tracers.opentelemetry.resource_detectors.environment
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.tracers.opentelemetry.resource_detectors.v3.EnvironmentResourceDetectorConfig

# Metrics
stats_sinks:
  - name: envoy.stat_sinks.open_telemetry
    typed_config:
      "@type": type.googleapis.com/envoy.extensions.stat_sinks.open_telemetry.v3.SinkConfig
      grpc_service:
        envoy_grpc:
          cluster_name: otel_collector
        timeout: 5s
      report_counters_as_deltas: true

stats_flush_interval: 15s

static_resources:
  listeners:
    - name: intercell_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080    # HTTP from Agent Core
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: intercell_gw
                codec_type: AUTO

                request_id_extension:
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.request_id.uuid.v3.UuidRequestIdConfig
                    use_request_id_for_trace_sampling: true

                tracing:
                  provider:
                    name: envoy.tracers.opentelemetry
                    typed_config:
                      "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                      grpc_service:
                        envoy_grpc:
                          cluster_name: otel_collector
                        timeout: 5s
                      service_name: "intercell-gateway"
                  random_sampling:
                    value: 100
                  custom_tags:
                    - tag: "cell.gateway"
                      literal:
                        value: "intercell"
                    - tag: "url.path"
                      request_header:
                        name: ":path"
                        default_value: unknown

                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          timestamp:        "%START_TIME%"
                          direction:        "intercell-egress"
                          method:           "%REQ(:METHOD)%"
                          path:             "%REQ(:PATH)%"
                          upstream:         "%UPSTREAM_HOST%"
                          upstream_cluster: "%UPSTREAM_CLUSTER%"
                          status:           "%RESPONSE_CODE%"
                          response_flags:   "%RESPONSE_FLAGS%"
                          duration_ms:      "%DURATION%"
                          bytes_sent:       "%BYTES_SENT%"
                          bytes_received:   "%BYTES_RECEIVED%"
                          request_id:       "%REQ(x-request-id)%"
                          traceparent:      "%REQ(traceparent)%"
                          invoker_agent_id:         "%REQ(x-agent-id)%"
                          service:          "intercell-gateway"

                http_filters:
                  # RBAC: allowlisted endpoints only.
                  - name: envoy.filters.http.rbac
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                      rules:
                        action: ALLOW
                        policies:
                          # MCP streamable-HTTP transport — POST (JSON-RPC) and GET (SSE stream)
                          allow_mcp:
                            permissions:
                              - and_rules:
                                  rules:
                                    - header:
                                        name: ":method"
                                        string_match:
                                          exact: POST
                                    - url_path:
                                        path:
                                          prefix: /mcp
                              - and_rules:
                                  rules:
                                    - header:
                                        name: ":method"
                                        string_match:
                                          exact: GET
                                    - url_path:
                                        path:
                                          prefix: /mcp
                            principals:
                              - any: true
                          # A2A task delegation to billing-investigation-agent-cell
                          allow_a2a_task:
                            permissions:
                              - and_rules:
                                  rules:
                                    - header:
                                        name: ":method"
                                        string_match:
                                          exact: POST
                                    - url_path:
                                        path:
                                          prefix: /a2a/
                            principals:
                              - any: true
                          # A2A agent card discovery — GET /a2a/.well-known/agent-card.json
                          allow_a2a_agent_card:
                            permissions:
                              - and_rules:
                                  rules:
                                    - header:
                                        name: ":method"
                                        string_match:
                                          exact: GET
                                    - url_path:
                                        path:
                                          prefix: /a2a/
                            principals:
                              - any: true

                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                      start_child_span: true

                route_config:
                  name: intercell_routes
                  virtual_hosts:
                    - name: cells
                      domains: ["*"]
                      routes:
                        # MCP streamable-HTTP — GET (SSE listen stream, persistent)
                        - match:
                            prefix: /mcp
                            headers:
                              - name: ":method"
                                exact_match: "GET"
                          route:
                            cluster: tools_cell_ingress
                            timeout: 0s
                            idle_timeout: 0s
                        # MCP streamable-HTTP — POST (JSON-RPC)
                        - match:
                            prefix: /mcp
                          route:
                            cluster: tools_cell_ingress
                            timeout: 60s
                        # A2A: strip /a2a/ prefix; agent2-core receives at / and /.well-known/agent-card.json
                        - match:
                            prefix: /a2a/
                          route:
                            cluster: billing_investigation_agent_cell_ingress
                            prefix_rewrite: /
                            timeout: 120s
                        # Catch-all deny
                        - match:
                            prefix: /
                          direct_response:
                            status: 403
                            body:
                              inline_string: '{"error":"path_not_allowed","detail":"This path is not in the inter-cell allowlist"}'

  clusters:
    # Tools Cell ingress (mTLS upstream via SPIRE SDS)
    - name: tools_cell_ingress
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          common_tls_context:
            # Workload certificate: SPIFFE ID of this gateway
            tls_certificate_sds_secret_configs:
              - name: "default"
                sds_config:
                  resource_api_version: V3
                  api_config_source:
                    api_type: GRPC
                    transport_api_version: V3
                    grpc_services:
                      - google_grpc:
                          target_uri: "unix:/run/spire/sockets/api.sock"
                          stat_prefix: spire_sds
                          channel_credentials:
                            local_credentials: {}
            # Peer validation: trust bundle for the cluster trust domain
            combined_validation_context:
              default_validation_context:
                # Restrict which workloads can be reached by pinning to their SPIFFE IDs.
                match_typed_subject_alt_names:
                  - san_type: URI
                    matcher:
                      exact: "spiffe://example.org/ns/tools-cell/sa/tools-ingress-gw"
              validation_context_sds_secret_config:
                name: "ROOTCA"
                sds_config:
                  resource_api_version: V3
                  api_config_source:
                    api_type: GRPC
                    transport_api_version: V3
                    grpc_services:
                      - google_grpc:
                          target_uri: "unix:/run/spire/sockets/api.sock"
                          stat_prefix: spire_sds
                          channel_credentials:
                            local_credentials: {}
      load_assignment:
        cluster_name: tools_cell_ingress
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: tools-ingress-gw.tools-cell.svc.cluster.local
                      port_value: 8443

    # Agent2 Cell intercell-gw (mTLS upstream via SPIRE SDS)
    - name: billing_investigation_agent_cell_ingress
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          common_tls_context:
            tls_certificate_sds_secret_configs:
              - name: "default"
                sds_config:
                  resource_api_version: V3
                  api_config_source:
                    api_type: GRPC
                    transport_api_version: V3
                    grpc_services:
                      - google_grpc:
                          target_uri: "unix:/run/spire/sockets/api.sock"
                          stat_prefix: spire_sds
                          channel_credentials:
                            local_credentials: {}
            combined_validation_context:
              default_validation_context:
                # Restrict which workloads can be reached by pinning to their SPIFFE IDs.
                match_typed_subject_alt_names:
                  - san_type: URI
                    matcher:
                      exact: "spiffe://example.org/ns/billing-investigation-agent-cell/sa/intercell-gw"
              validation_context_sds_secret_config:
                name: "ROOTCA"
                sds_config:
                  resource_api_version: V3
                  api_config_source:
                    api_type: GRPC
                    transport_api_version: V3
                    grpc_services:
                      - google_grpc:
                          target_uri: "unix:/run/spire/sockets/api.sock"
                          stat_prefix: spire_sds
                          channel_credentials:
                            local_credentials: {}
      load_assignment:
        cluster_name: billing_investigation_agent_cell_ingress
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: intercell-gw.billing-investigation-agent-cell.svc.cluster.local
                      port_value: 8443

    # OTel collector
    - name: otel_collector
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: otel_collector
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: "${OTEL_COLLECTOR_HOST}", port_value: 4317 }

admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9903
