# OPA Configuration — Tools Cell Authorization
#
# Runs the Envoy ext_authz gRPC plugin on port 9191.
# Envoy calls this endpoint for every inbound request to the tools cell.

plugins:
  envoy_ext_authz_grpc:
    addr: ":9191"
    path: envoy/authz/allow
    dry-run: false
    enable-reflection: false

decision_logs:
  console: true
