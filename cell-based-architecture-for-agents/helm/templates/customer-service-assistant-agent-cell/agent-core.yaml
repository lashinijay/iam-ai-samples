---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-core
  namespace: {{ .Values.customerServiceAssistantAgentCell.namespace }}
  labels:
    {{- include "cell-based-agent.labels" . | nindent 4 }}
    app.kubernetes.io/name: agent-core
    app.kubernetes.io/component: agent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-core
  namespace: {{ .Values.customerServiceAssistantAgentCell.namespace }}
  labels:
    {{- include "cell-based-agent.labels" . | nindent 4 }}
    app.kubernetes.io/name: agent-core
    app.kubernetes.io/component: agent
spec:
  replicas: {{ .Values.customerServiceAssistantAgentCell.core.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-core
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: agent-core
      securityContext:
        {{- include "cell-based-agent.podSecurityContext" . | nindent 8 }}
      containers:
        - name: agent-core
          image: {{ .Values.customerServiceAssistantAgentCell.core.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: EGRESS_GW_URL
              value: "http://egress-gw.{{ .Values.customerServiceAssistantAgentCell.namespace }}.svc.cluster.local:8080"
            - name: INTERCELL_GW_URL
              value: "http://intercell-gw.{{ .Values.customerServiceAssistantAgentCell.namespace }}.svc.cluster.local:8080"
            - name: BILLING_AGENT_URL
              value: "http://intercell-gw.{{ .Values.billingInvestigationAgentCell.namespace }}.svc.cluster.local:8080/a2a/"
            - name: AUTH_SERVICE_URL
              value: "http://localhost:8081"
            - name: LOG_LEVEL
              value: "INFO"
            - name: AGENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.customerServiceAssistantAgentCell.core.oauthCredentialsSecretName }}
                  key: AGENT_ID
            - name: AGENT_SCOPES
              value: {{ .Values.customerServiceAssistantAgentCell.core.agentScopes | quote }}
            - name: MODEL
              value: {{ .Values.customerServiceAssistantAgentCell.core.model | quote }}
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
        - name: auth-service
          image: {{ .Values.customerServiceAssistantAgentCell.core.authServiceImage }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: auth-internal
          env:
            - name: ASGARDEO_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.customerServiceAssistantAgentCell.core.oauthCredentialsSecretName }}
                  key: ASGARDEO_BASE_URL
            - name: CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.customerServiceAssistantAgentCell.core.oauthCredentialsSecretName }}
                  key: CLIENT_ID
            - name: REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.customerServiceAssistantAgentCell.core.oauthCredentialsSecretName }}
                  key: REDIRECT_URI
            - name: AGENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.customerServiceAssistantAgentCell.core.oauthCredentialsSecretName }}
                  key: AGENT_ID
            - name: AGENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.customerServiceAssistantAgentCell.core.oauthCredentialsSecretName }}
                  key: AGENT_SECRET
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            runAsUser: 1001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: agent-core
  namespace: {{ .Values.customerServiceAssistantAgentCell.namespace }}
  labels:
    {{- include "cell-based-agent.labels" . | nindent 4 }}
    app.kubernetes.io/name: agent-core
    app.kubernetes.io/component: agent
spec:
  selector:
    app.kubernetes.io/name: agent-core
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  ports:
    - port: 8080
      targetPort: 8080
      name: http
    - port: 8081
      targetPort: 8081
      name: auth
