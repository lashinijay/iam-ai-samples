---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opa
  namespace: {{ .Values.toolsCell.namespace }}
  labels:
    {{- include "cell-based-agent.labels" . | nindent 4 }}
    app.kubernetes.io/name: opa
    app.kubernetes.io/component: authz
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-policy
  namespace: {{ .Values.toolsCell.namespace }}
  labels:
    {{- include "cell-based-agent.labels" . | nindent 4 }}
    app.kubernetes.io/name: opa
    app.kubernetes.io/component: authz
data:
  opa-config.yaml: |
{{ .Files.Get "files/tools-cell/opa-config.yaml" | indent 4 }}
  policy.rego: |
{{ .Files.Get "files/tools-cell/policy.rego" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  namespace: {{ .Values.toolsCell.namespace }}
  labels:
    {{- include "cell-based-agent.labels" . | nindent 4 }}
    app.kubernetes.io/name: opa
    app.kubernetes.io/component: authz
spec:
  replicas: {{ .Values.toolsCell.opa.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: opa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opa
        app.kubernetes.io/component: authz
    spec:
      serviceAccountName: opa
      securityContext:
        {{- include "cell-based-agent.podSecurityContext" . | nindent 8 }}
      initContainers:
        - name: envsubst
          image: {{ .Values.toolsCell.opa.envsubstImage }}
          command:
            - sh
            - -c
            - |
              cp /config-template/opa-config.yaml /etc/opa/opa-config.yaml
              envsubst < /config-template/policy.rego > /etc/opa/policy.rego
          envFrom:
            - secretRef:
                name: {{ .Values.toolsCell.opa.agentIdsSecretName }}
          volumeMounts:
            - name: opa-policy-template
              mountPath: /config-template
            - name: opa-policy-rendered
              mountPath: /etc/opa
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: opa
          image: {{ .Values.toolsCell.opa.image }}
          args:
            - run
            - --server
            - --config-file=/etc/opa/opa-config.yaml
            - --addr=0.0.0.0:8181
            - --diagnostic-addr=0.0.0.0:8282
            - /etc/opa/policy.rego
          ports:
            - containerPort: 9191
              name: grpc-authz
            - containerPort: 8181
              name: http-api
            - containerPort: 8282
              name: diagnostics
          volumeMounts:
            - name: opa-policy-rendered
              mountPath: /etc/opa
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: 8282
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8282
            initialDelaySeconds: 5
            periodSeconds: 15
      volumes:
        - name: opa-policy-template
          configMap:
            name: opa-policy
        - name: opa-policy-rendered
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: opa
  namespace: {{ .Values.toolsCell.namespace }}
  labels:
    {{- include "cell-based-agent.labels" . | nindent 4 }}
    app.kubernetes.io/name: opa
    app.kubernetes.io/component: authz
spec:
  selector:
    app.kubernetes.io/name: opa
  ports:
    - port: 9191
      targetPort: 9191
      name: grpc-authz
    - port: 8181
      targetPort: 8181
      name: http-api
