---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tools-service
  namespace: {{ .Values.toolsCell.namespace }}
  labels:
    {{- include "cell-based-agent.labels" . | nindent 4 }}
    app.kubernetes.io/name: tools-service
    app.kubernetes.io/component: service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tools-service
  namespace: {{ .Values.toolsCell.namespace }}
  labels:
    {{- include "cell-based-agent.labels" . | nindent 4 }}
    app.kubernetes.io/name: tools-service
    app.kubernetes.io/component: service
spec:
  replicas: {{ .Values.toolsCell.service.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: tools-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tools-service
        app.kubernetes.io/component: service
    spec:
      serviceAccountName: tools-service
      securityContext:
        {{- include "cell-based-agent.podSecurityContext" . | nindent 8 }}
      containers:
        - name: tools-service
          image: {{ .Values.toolsCell.service.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
              name: http
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: tools-service
  namespace: {{ .Values.toolsCell.namespace }}
  labels:
    {{- include "cell-based-agent.labels" . | nindent 4 }}
    app.kubernetes.io/name: tools-service
    app.kubernetes.io/component: service
spec:
  selector:
    app.kubernetes.io/name: tools-service
  ports:
    - port: 8090
      targetPort: 8090
      name: http
