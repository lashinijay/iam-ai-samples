---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: intercell-gw
  namespace: {{ .Values.billingInvestigationAgentCell.namespace }}
  labels:
    {{- include "cell-based-agent.labels" . | nindent 4 }}
    app.kubernetes.io/name: intercell-gw
    app.kubernetes.io/component: gateway
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: intercell-gw-envoy-config
  namespace: {{ .Values.billingInvestigationAgentCell.namespace }}
  labels:
    {{- include "cell-based-agent.labels" . | nindent 4 }}
    app.kubernetes.io/name: intercell-gw
    app.kubernetes.io/component: gateway
data:
  envoy.yaml: |
{{ .Files.Get "files/billing-investigation-agent-cell/intercell-envoy.yaml" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intercell-gw
  namespace: {{ .Values.billingInvestigationAgentCell.namespace }}
  labels:
    {{- include "cell-based-agent.labels" . | nindent 4 }}
    app.kubernetes.io/name: intercell-gw
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.billingInvestigationAgentCell.intercell.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: intercell-gw
  template:
    metadata:
      labels:
        app.kubernetes.io/name: intercell-gw
        app.kubernetes.io/component: gateway
    spec:
      serviceAccountName: intercell-gw
      securityContext:
        {{- include "cell-based-agent.podSecurityContext" . | nindent 8 }}
      initContainers:
        - name: envsubst
          image: {{ .Values.billingInvestigationAgentCell.intercell.envsubstImage }}
          command: ["sh", "-c", "envsubst < /config-template/envoy.yaml > /etc/envoy/envoy.yaml"]
          env:
            - name: OTEL_COLLECTOR_HOST
              value: {{ .Values.global.otelCollectorHost | quote }}
            - name: JWT_ISSUER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.billingInvestigationAgentCell.intercell.jwtValidationSecretName }}
                  key: JWT_ISSUER
            - name: JWT_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.billingInvestigationAgentCell.intercell.jwtValidationSecretName }}
                  key: JWT_AUDIENCE
            - name: JWKS_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.billingInvestigationAgentCell.intercell.jwtValidationSecretName }}
                  key: JWKS_URI
            - name: JWKS_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.billingInvestigationAgentCell.intercell.jwtValidationSecretName }}
                  key: JWKS_HOST
          volumeMounts:
            - name: envoy-config-template
              mountPath: /config-template
            - name: envoy-config-rendered
              mountPath: /etc/envoy
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: envoy
          image: {{ .Values.billingInvestigationAgentCell.intercell.envoyImage }}
          args: ["-c", "/etc/envoy/envoy.yaml", "--service-cluster", "agent2-intercell-gw"]
          ports:
            - containerPort: 8443
              name: https
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: envoy-config-rendered
              mountPath: /etc/envoy
              readOnly: true
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsUser: 101
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: envoy-config-template
          configMap:
            name: intercell-gw-envoy-config
        - name: envoy-config-rendered
          emptyDir: {}
        - name: spire-agent-socket
          csi:
            driver: csi.spiffe.io
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: intercell-gw
  namespace: {{ .Values.billingInvestigationAgentCell.namespace }}
  labels:
    {{- include "cell-based-agent.labels" . | nindent 4 }}
    app.kubernetes.io/name: intercell-gw
    app.kubernetes.io/component: gateway
spec:
  selector:
    app.kubernetes.io/name: intercell-gw
  ports:
    - port: 8443
      targetPort: 8443
      name: https
    - port: 8080
      targetPort: 8080
      name: http
